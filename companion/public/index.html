<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Trip Guest Portal</title>
  <!-- Mapbox is the only browser-side third-party runtime dependency. -->
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.22.0/mapbox-gl.css">
  <link rel="stylesheet" href="./style.css?v=3.4.11">
</head>
<body>
  <div id="app">
    <div class="initial-loader"><div class="spinner"></div><div>Loading trip…</div></div>
  </div>
  <!-- Load deployment-local public configuration before Mapbox and app.js. -->
  <script src="./config.js?v=3.4.11"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.22.0/mapbox-gl.js"></script>
  <!-- app.js bootstraps the one-time guest session and renders the portal. -->
  <script src="./app.js?v=3.4.11"></script>
</body>
</html>

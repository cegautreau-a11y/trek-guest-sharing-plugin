# Same-origin Guest Portal path for the HTTPS server block that fronts TREK.
# The dedicated guest-hostname layout is recommended; see nginx-guest-server.conf.
location /guest-portal/ {
    proxy_pass http://127.0.0.1:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Enable companion proxy-header trust only after Nginx real_ip is configured.
    proxy_set_header X-Guest-Client-IP $remote_addr;
}

# Recommended layout: Guest Portal on a dedicated hostname.
# Replace hostname, certificate directives, and backend address for your site.
server {
    listen 443 ssl;
    server_name guest.example.com;

    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Enable companion proxy-header trust only after Nginx real_ip is configured.
        proxy_set_header X-Guest-Client-IP $remote_addr;
    }
}

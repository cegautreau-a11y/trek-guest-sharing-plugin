# Guest Portal rules for an existing TREK Apache vhost.
# Keep TREK's /ws and /mcp rules before these blocks if you use them.
#
# CLIENT IP LOGGING WITH CLOUDFLARE + LOCAL SPLIT DNS
# --------------------------------------------------
# Recommended modules:
#   a2enmod proxy proxy_http headers remoteip
#
# If this hostname is proxied by Cloudflare externally, configure mod_remoteip
# with Cloudflare's CURRENT IP ranges. Do not blindly trust CF-Connecting-IP
# from arbitrary source addresses.
#
#   RemoteIPHeader CF-Connecting-IP
#   RemoteIPTrustedProxyList /etc/apache2/cloudflare-ips.conf
#
# /etc/apache2/cloudflare-ips.conf should contain the current IPv4 + IPv6
# Cloudflare edge CIDRs, one per line. Refresh that file when Cloudflare changes
# its published ranges.
#
# Local split-DNS clients that reach Apache directly do not have a trusted
# CF-Connecting-IP source; their normal LAN source address remains REMOTE_ADDR.
#
# Always remove any browser-supplied copy, then set ONE application-specific
# client-IP header from Apache's post-mod_remoteip REMOTE_ADDR.
RequestHeader unset X-Guest-Client-IP
RequestHeader set X-Guest-Client-IP "expr=%{REMOTE_ADDR}"
ProxyAddHeaders On

# Guest Portal companion MUST be before the final ProxyPass "/" rule.
ProxyPass        "/guest-portal/" "http://127.0.0.1:8088/" connectiontimeout=5 timeout=300 retry=0
ProxyPassReverse "/guest-portal/" "http://127.0.0.1:8088/"
RedirectMatch 302 ^/guest-portal$ /guest-portal/

# Existing TREK catch-all MUST remain last.
ProxyPass        "/" "http://127.0.0.1:3300/" connectiontimeout=5 timeout=300 retry=0
ProxyPassReverse "/" "http://127.0.0.1:3300/"

# Optional Apache access log format using mod_remoteip's resolved client address.
# `%a` is the user-agent/client IP after mod_remoteip; `%{c}a` is the actual
# TCP peer (Cloudflare or direct client).
# LogFormat "%a peer=%{c}a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" trek_realip
# CustomLog ${APACHE_LOG_DIR}/trek-access.log trek_realip
